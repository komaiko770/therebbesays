# fly.toml app configuration file for therebbesays-embed
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'therebbesays-embed'
primary_region = 'iad'

[build]

[env]
  # The Deno research worker embeds queries by calling the local Python /embed endpoint
  # in the same container — no external round-trip. Non-secret, so it lives here rather
  # than in `fly secrets`.
  EMBEDDING_SERVICE_URL = 'http://127.0.0.1:8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
